spring.application.name=gateway
server.port=8080

# Auth Service Route
spring.cloud.gateway.server.webflux.routes[0].id=auth-service
spring.cloud.gateway.server.webflux.routes[0].uri=http://auth-service:8081
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/auth/**

# Product Service Route
spring.cloud.gateway.server.webflux.routes[1].id=product-service
spring.cloud.gateway.server.webflux.routes[1].uri=http://product-service:8082
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/api/products/**,/api/categories/**

# JWT
jwt.secret=ecommerce-secret-key-must-be-at-least-256-bits-long-for-hs256

# Order Service Route
spring.cloud.gateway.server.webflux.routes[2].id=order-service
spring.cloud.gateway.server.webflux.routes[2].uri=http://order-service:8083
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/api/orders/**

# Cart Service Route
spring.cloud.gateway.server.webflux.routes[3].id=cart-service
spring.cloud.gateway.server.webflux.routes[3].uri=http://cart-service:8085
spring.cloud.gateway.server.webflux.routes[3].predicates[0]=Path=/api/cart/**

# Redis Configuration
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.timeout=60000ms
spring.data.redis.database=0
