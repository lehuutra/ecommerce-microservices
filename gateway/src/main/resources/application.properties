spring.application.name=gateway
server.port=8080

# Auth Service Route
spring.cloud.gateway.server.webflux.routes[0].id=auth-service
spring.cloud.gateway.server.webflux.routes[0].uri=${AUTH_SERVICE_URL:http://localhost:8081}
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/auth/**

# Product Service Route
spring.cloud.gateway.server.webflux.routes[1].id=product-service
spring.cloud.gateway.server.webflux.routes[1].uri=${PRODUCT_SERVICE_URL:http://localhost:8082}
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/api/products/**,/api/categories/**

# JWT
jwt.secret=${JWT_SECRET:ecommerce-secret-key-must-be-at-least-256-bits-long-for-hs256}

# Order Service Route
spring.cloud.gateway.server.webflux.routes[2].id=order-service
spring.cloud.gateway.server.webflux.routes[2].uri=${ORDER_SERVICE_URL:http://localhost:8083}
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/api/orders/**

# Cart Service Route
spring.cloud.gateway.server.webflux.routes[3].id=cart-service
spring.cloud.gateway.server.webflux.routes[3].uri=${CART_SERVICE_URL:http://localhost:8085}
spring.cloud.gateway.server.webflux.routes[3].predicates[0]=Path=/api/cart/**

# Payment Service Route
spring.cloud.gateway.server.webflux.routes[4].id=payment-service
spring.cloud.gateway.server.webflux.routes[4].uri=${PAYMENT_SERVICE_URL:http://localhost:8084}
spring.cloud.gateway.server.webflux.routes[4].predicates[0]=Path=/api/payments/**

# Redis Configuration
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.timeout=60000ms
spring.data.redis.database=0
