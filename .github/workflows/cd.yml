name: Container Delivery

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  publish-images:
    runs-on: ubuntu-latest
    name: Publish ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: ecommerce-gateway
            context: ./gateway
          - image: ecommerce-auth-service
            context: ./services/auth-service
          - image: ecommerce-product-service
            context: ./services/product-service
          - image: ecommerce-cart-service
            context: ./services/cart-service
          - image: ecommerce-order-service
            context: ./services/order-service
          - image: ecommerce-payment-service
            context: ./services/payment-service
          - image: ecommerce-notification-service
            context: ./services/notification-service
    steps:
      - name: Checkout source code
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.image }}
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.image }}:latest
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.image }}:${{ github.sha }}
